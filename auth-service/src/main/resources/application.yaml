server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yuu_saas}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate, bukan update. Skema service ini dikelola migrasi Flyway (V1-V12),
      # jadi Hibernate tidak boleh lagi mengubah tabel diam-diam. Ketidakcocokan
      # entity kini menggagalkan startup dengan keras — itu memang yang diinginkan:
      # `update` pernah mencoba mengubah kolom bytea jadi oid tanpa ada yang memintanya,
      # dan di database bersama ini satu service bisa mengubah tabel milik service lain.
      ddl-auto: validate
    show-sql: true

  servlet:
    multipart:
      # Ditegakkan Tomcat sebelum request menyentuh controller, jadi unggahan besar
      # ditolak tanpa pernah dibaca ke memori. MediaService memeriksa ulang batas yang
      # sama — kalau konfigurasi ini pernah diubah, kode tetap menolak.
      max-file-size: 2MB
      max-request-size: 3MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # baseline-version 0 agar seluruh migrasi V1-V15 dieksekusi dari awal pada
    # database baru maupun database bersama service lain.
    baseline-version: 0
    # Tabel riwayat sendiri: notification-service memakai
    # flyway_schema_history_notification di database yang sama.
    table: flyway_schema_history_auth

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-expiration-ms: 604800000 # 7 days
  issuer: devflow-auth-service

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # Shared secret untuk POST /api/v1/notifications/internal. Tanpa default:
  # service harus gagal start daripada menerima notifikasi tanpa autentikasi.
  internal-token: ${NOTIFICATION_INTERNAL_TOKEN}

  # Sudah ada di .env sejak lama tapi tidak pernah dibaca kode mana pun sampai
  # LoginRateLimiter dibuat.
  login-rate-limit:
    email-ip: ${LOGIN_RATE_LIMIT_EMAIL_IP:10}
    ip: ${LOGIN_RATE_LIMIT_IP:30}
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}

  # Menentukan entri mana di X-Forwarded-For yang milik klien sungguhan.
  trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/oauth2/callback}

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/oauth2/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Origin yang boleh memanggil auth-service langsung. Sebelumnya SecurityConfig
# memakai "*", yang membatalkan daftar terbatas di api-gateway untuk siapa pun
# yang menembak port 8081 langsung.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  pattern:
    # %X{requestId} mengambil nilai yang dipasang RequestIdFilter. Tanpa ini id-nya
    # ada di MDC tapi tidak pernah muncul di log, jadi tidak menolong siapa pun.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
