server:
  port: 8084

spring:
  application:
    name: integration-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yuu_saas}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_integration

  jpa:
    hibernate:
      # validate: skema service ini dikelola Flyway (baseline v2 + V3). Lihat catatan
      # yang sama di auth-service — di database bersama, `update` membuat satu service
      # bisa mengubah tabel milik service lain tanpa ada yang memintanya.
      ddl-auto: validate
    show-sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

jwt:
  # Tanpa default: semua service harus memakai secret yang sama dengan auth-service.
  secret: ${JWT_SECRET}

github:
  webhook-secret: ${GITHUB_WEBHOOK_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    # %X{requestId} mengambil nilai yang dipasang RequestIdFilter. Tanpa ini id-nya
    # ada di MDC tapi tidak pernah muncul di log, jadi tidak menolong siapa pun.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
