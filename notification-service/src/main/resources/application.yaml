server:
  port: 8086

spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yuu_saas}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Default baseline-version Flyway adalah 1, jadi pada database yang sudah berisi
    # tabel service lain baris baseline ditulis di versi 1 dan V1__init hanya
    # dianggap "sudah ada" — tabel processed_events tidak pernah dibuat dan
    # ddl-auto: validate gagal start. Baseline di 0 supaya V1 tetap dijalankan.
    baseline-version: 0
    # Semua service berbagi database yuu_saas, jadi riwayat migration dipisah per service.
    table: flyway_schema_history_notification

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Pesan yang tetap gagal setelah retry dibuang ke DLQ, bukan di-requeue selamanya.
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 30s
          multiplier: 4
          # Wajib: default Boot adalah 10s, yang akan memotong initial-interval 30s
          # dan membuat multiplier tidak pernah berlaku.
          max-interval: 30m
          max-attempts: 5

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  internal-token: ${NOTIFICATION_INTERNAL_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # %X{requestId} mengambil nilai yang dipasang RequestIdFilter. Tanpa ini id-nya
    # ada di MDC tapi tidak pernah muncul di log, jadi tidak menolong siapa pun.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
