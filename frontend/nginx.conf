server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    # Batas bawaan nginx adalah 1 MB, dan itu batas KETIGA di jalur yang sama:
    # auth-service menerima unggahan sampai 2 MB dan codec gateway disetel 3 MB,
    # tapi nginx menolak lebih dulu dengan 413 sebelum permintaan sempat keluar
    # dari container frontend. Unggahan 1,4 MB lolos lewat :8080 dan gagal lewat
    # :3000 — dan :3000 adalah jalur yang dipakai browser.
    #
    # Disamakan dengan codec gateway; auth-service tetap penegak batas sebenarnya
    # di 2 MB, sekarang sebagai satu-satunya yang menolak.
    client_max_body_size 3m;

    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # OAuth provider endpoints go to auth-service through gateway.
  location ~ ^/oauth2/(google|github)(/|$) {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # OAuth callback is a React route and must fall back to the SPA entrypoint.
  location /oauth2/ {
    try_files $uri $uri/ /index.html;
  }

  # Aset ber-hash: isinya tidak pernah berubah untuk nama yang sama, jadi aman
  # di-cache selamanya. Yang penting justru `=404`: tanpa itu aset yang hilang
  # jatuh ke fallback SPA dan nginx mengirim index.html dengan Content-Type
  # text/html untuk permintaan .js. Browser menolaknya —
  # "Expected a JavaScript-or-Wasm module script" — dan halamannya putih.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html tidak boleh di-cache. Nama aset ber-hash berubah setiap build, jadi
  # index.html basi menunjuk bundle yang sudah tidak ada — setiap deploy akan
  # memberi layar putih pada siapa pun yang masih memegang salinan lama.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }
}
