services:
  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: ../Dockerfile.backend
    extra_hosts: &backend-hosts
      - "host.docker.internal:host-gateway"
    environment: &backend-env
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://dev-flow.yuuashura.my.id,http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-https://dev-flow.yuuashura.my.id}
      APP_URL: ${APP_URL:-https://dev-flow.yuuashura.my.id}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:?NOTIFICATION_INTERNAL_TOKEN is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://dev-flow.yuuashura.my.id/oauth2/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-https://dev-flow.yuuashura.my.id/oauth2/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET is required}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  workspace-service:
    build:
      context: ./workspace-service
      dockerfile: ../Dockerfile.backend
    extra_hosts: *backend-hosts
    environment: *backend-env
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  project-service:
    build:
      context: ./project-service
      dockerfile: ../Dockerfile.backend
    extra_hosts: *backend-hosts
    environment: *backend-env
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  integration-service:
    build:
      context: ./integration-service
      dockerfile: ../Dockerfile.backend
    extra_hosts: *backend-hosts
    environment:
      <<: *backend-env
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET is required}
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  billing-service:
    build:
      context: ./billing-service
      dockerfile: ../Dockerfile.backend
    extra_hosts: *backend-hosts
    environment:
      <<: *backend-env
      XENDIT_BASE_URL: ${XENDIT_BASE_URL:-https://api.xendit.co}
      XENDIT_API_KEY: ${XENDIT_API_KEY:-}
      XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN:?XENDIT_CALLBACK_TOKEN is required}
      XENDIT_CALLBACK_URL: ${XENDIT_CALLBACK_URL:-}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: ../Dockerfile.backend
    extra_hosts: *backend-hosts
    environment:
      <<: *backend-env
      AUTH_SERVICE_URL: http://auth-service:8081
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:?NOTIFICATION_INTERNAL_TOKEN is required}
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ../Dockerfile.backend
    environment:
      GATEWAY_SELF_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://dev-flow.yuuashura.my.id,http://localhost:3000,http://localhost:5173}
      AUTH_SERVICE_URL: http://auth-service:8081
      WORKSPACE_SERVICE_URL: http://workspace-service:8082
      PROJECT_SERVICE_URL: http://project-service:8083
      INTEGRATION_SERVICE_URL: http://integration-service:8084
      BILLING_SERVICE_URL: http://billing-service:8085
    depends_on:
      - auth-service
      - workspace-service
      - project-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "13000:80"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.devflow.rule=Host(`dev-flow.yuuashura.my.id`)"
      - "traefik.http.routers.devflow.entrypoints=websecure"
      - "traefik.http.routers.devflow.tls.certresolver=letsencrypt"
      - "traefik.http.services.devflow.loadbalancer.server.port=80"
    depends_on:
      - api-gateway
    restart: unless-stopped

networks:
  default:
  dokploy-network:
    external: true
